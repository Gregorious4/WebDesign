<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunar Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

#gameCanvas { display: block; width: 100%; height: 100%; }

#crt-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 10;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
}

/* ── HUD ── */
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 14px 20px; display: flex; justify-content: space-between;
  pointer-events: none; z-index: 20; gap: 10px;
}
.hud-panel {
  border: 1px solid rgba(57,255,20,0.35); padding: 8px 14px;
  background: rgba(0,8,0,0.75); min-width: 140px; font-family: 'VT323', monospace;
}
.hud-label { font-size: 11px; color: rgba(57,255,20,0.45); letter-spacing: 0.35em; display: block; margin-bottom: 2px; }
.hud-value { font-size: 26px; color: #39ff14; text-shadow: 0 0 10px rgba(57,255,20,0.55); }
.hud-value.warn { color: #ff8c00; text-shadow: 0 0 10px rgba(255,140,0,0.55); }
.hud-value.danger { color: #ff2020; text-shadow: 0 0 10px rgba(255,32,32,0.55); }
#fuel-bar-bg { margin-top: 5px; height: 3px; background: rgba(57,255,20,0.15); }
#fuel-bar { height: 100%; width: 100%; background: #39ff14; transition: width .1s, background .3s; }

/* ── Controls hint ── */
#hint {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  font-family: 'VT323', monospace; font-size: 15px; letter-spacing: .22em;
  color: rgba(57,255,20,0.4); pointer-events: none; z-index: 20; white-space: nowrap;
}

/* ── Title Screen ── */
#title-screen {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 200;
  background: rgba(0,0,0,0.92); transition: opacity .6s; font-family: 'VT323', monospace;
}
#title-screen h1 {
  font-size: clamp(42px, 8vw, 84px); color: #39ff14;
  text-shadow: 0 0 40px rgba(57,255,20,.6); letter-spacing: .08em; margin-bottom: 6px;
}
#title-screen .sub {
  font-family: 'Share Tech Mono', monospace; color: rgba(57,255,20,.5);
  font-size: clamp(11px, 1.8vw, 15px); letter-spacing: .25em; margin-bottom: 36px;
}
.start-btn {
  padding: 12px 40px; border: 2px solid #39ff14; background: none;
  color: #39ff14; font-family: 'VT323', monospace; font-size: 28px;
  letter-spacing: .2em; cursor: pointer;
  animation: pulse-glow 2s ease-in-out infinite;
  transition: background .2s;
}
.start-btn:hover { background: rgba(57,255,20,.1); }
@keyframes pulse-glow {
  0%,100% { box-shadow: 0 0 10px rgba(57,255,20,.25); }
  50%      { box-shadow: 0 0 28px rgba(57,255,20,.65), inset 0 0 18px rgba(57,255,20,.08); }
}
.ctrl-grid {
  margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr;
  gap: 6px 28px; font-size: 17px; color: rgba(57,255,20,.45);
  letter-spacing: .12em; text-align: right;
}
.ctrl-grid span:nth-child(even) { text-align: left; color: rgba(57,255,20,.7); }

/* ── Overlay (crash / success) ── */
#overlay {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 150;
  pointer-events: none; opacity: 0; transition: opacity .4s; font-family: 'VT323', monospace;
}
#overlay.show { opacity: 1; pointer-events: all; }
#overlay-title { font-size: clamp(44px, 9vw, 88px); letter-spacing: .1em; }
#overlay-title.crash { color: #ff2020; text-shadow: 0 0 30px rgba(255,32,32,.7); }
#overlay-title.success { color: #39ff14; text-shadow: 0 0 30px rgba(57,255,20,.7); }
#overlay-sub {
  font-family: 'Share Tech Mono', monospace; font-size: 13px;
  color: rgba(255,255,255,.45); margin: 10px 0 22px; letter-spacing: .2em;
}
.retry-btn {
  padding: 9px 30px; border: 1px solid rgba(255,255,255,.5);
  background: none; font-family: 'VT323', monospace; font-size: 24px;
  letter-spacing: .15em; cursor: pointer; color: rgba(255,255,255,.65);
  transition: background .2s;
}
.retry-btn:hover { background: rgba(255,255,255,.08); }

/* ── Project Modal ── */
#modal {
  position: fixed; inset: 0; display: flex; align-items: center;
  justify-content: center; z-index: 100; background: rgba(0,0,0,.87);
  opacity: 0; pointer-events: none; transition: opacity .4s;
}
#modal.show { opacity: 1; pointer-events: all; }
.m-card {
  width: min(680px, 92vw); border: 2px solid #39ff14;
  background: #030a03; padding: 28px 32px; position: relative;
  box-shadow: 0 0 50px rgba(57,255,20,.25), inset 0 0 50px rgba(0,0,0,.4);
  font-family: 'VT323', monospace;
}
.m-card::before, .m-card::after {
  content: ''; position: absolute; width: 18px; height: 18px; border-color: #39ff14; border-style: solid;
}
.m-card::before { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
.m-card::after  { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }
.m-pad { font-size: 12px; color: rgba(57,255,20,.5); letter-spacing: .35em; margin-bottom: 6px; }
.m-title {
  font-size: clamp(32px, 5vw, 50px); color: #39ff14; line-height: 1;
  text-shadow: 0 0 18px rgba(57,255,20,.45); margin-bottom: 16px;
}
.m-img {
  width: 100%; height: 190px; background: #081008; border: 1px solid rgba(57,255,20,.25);
  margin-bottom: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.m-img img { width: 100%; height: 100%; object-fit: cover; }
.m-img .ph {
  font-family: 'Share Tech Mono', monospace; font-size: 12px;
  color: rgba(57,255,20,.25); letter-spacing: .2em; text-align: center; padding: 10px;
}
.m-desc {
  font-family: 'Share Tech Mono', monospace; font-size: 13px;
  color: rgba(57,255,20,.75); line-height: 1.65; margin-bottom: 18px;
}
.m-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
.m-tag {
  padding: 3px 11px; border: 1px solid rgba(57,255,20,.4);
  color: #39ff14; font-size: 14px; letter-spacing: .08em;
}
.m-links { display: flex; gap: 10px; flex-wrap: wrap; }
.m-link {
  padding: 7px 18px; border: 1px solid #39ff14; color: #39ff14;
  text-decoration: none; font-size: 20px; letter-spacing: .1em; transition: all .2s;
}
.m-link:hover { background: rgba(57,255,20,.12); box-shadow: 0 0 12px rgba(57,255,20,.35); }
.m-close {
  position: absolute; top: 14px; right: 14px; background: none;
  border: 1px solid rgba(57,255,20,.4); color: #39ff14; font-family: 'VT323',monospace;
  font-size: 19px; padding: 3px 11px; cursor: pointer; letter-spacing: .1em; transition: all .2s;
}
.m-close:hover { background: rgba(57,255,20,.12); }

/* ── Touch controls ── */
#touch-btns {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; z-index: 30; opacity: .65;
}
.t-btn {
  width: 58px; height: 58px; background: rgba(57,255,20,.08);
  border: 1px solid rgba(57,255,20,.45); color: #39ff14;
  font-size: 22px; font-family: 'VT323',monospace; cursor: pointer;
  user-select: none; -webkit-user-select: none;
}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="crt-overlay"></div>

<!-- HUD -->
<div id="hud">
  <div class="hud-panel">
    <span class="hud-label">VELOCITY</span>
    <div class="hud-value" id="h-vel">0.0 m/s</div>
  </div>
  <div class="hud-panel" style="text-align:center">
    <span class="hud-label">FUEL</span>
    <div class="hud-value" id="h-fuel">100%</div>
    <div id="fuel-bar-bg"><div id="fuel-bar"></div></div>
  </div>
  <div class="hud-panel" style="text-align:right">
    <span class="hud-label">ALTITUDE</span>
    <div class="hud-value" id="h-alt">0 m</div>
  </div>
</div>

<div id="hint">← → ROTATE &nbsp;|&nbsp; ↑ THRUST &nbsp;|&nbsp; LAND ON PADS TO EXPLORE PROJECTS</div>

<!-- Title Screen -->
<div id="title-screen">
  <h1>LUNAR PORTFOLIO</h1>
  <p class="sub">navigate the surface to explore my work</p>
  <button class="start-btn" id="startBtn">[ LAUNCH MISSION ]</button>
  <div class="ctrl-grid">
    <span>← →</span><span>ROTATE</span>
    <span>↑ / W</span><span>THRUST</span>
    <span>SLOW + UPRIGHT</span><span>SAFE LANDING</span>
  </div>
</div>

<!-- Crash / Success Overlay -->
<div id="overlay">
  <div id="overlay-title" class="crash">CRASH</div>
  <div id="overlay-sub">Too fast.</div>
  <button class="retry-btn" id="retryBtn">[ TRY AGAIN ]</button>
</div>

<!-- Project Modal -->
<div id="modal">
  <div class="m-card">
    <button class="m-close" id="modalClose">[ CLOSE ]</button>
    <div class="m-pad" id="m-pad">PAD ALPHA</div>
    <div class="m-title" id="m-title">Project</div>
    <div class="m-img" id="m-img"><span class="ph">[ NO IMAGE SET ]</span></div>
    <p class="m-desc" id="m-desc"></p>
    <div class="m-tags" id="m-tags"></div>
    <div class="m-links" id="m-links"></div>
  </div>
</div>

<!-- Touch Controls -->
<div id="touch-btns">
  <button class="t-btn" id="tl">◀</button>
  <button class="t-btn" id="tt">▲</button>
  <button class="t-btn" id="tr">▶</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  ✏️  CUSTOMIZE YOUR PROJECTS HERE
//  - name:        Title shown in the modal
//  - image:       Path to your screenshot/thumbnail (e.g. "images/game1.png")
//                 Leave "" to show a placeholder
//  - description: Short paragraph about the project
//  - tags:        Tech, tools, genre — shown as small badges
//  - links:       Buttons at the bottom (label + href)
// ═══════════════════════════════════════════════════════════════
const PROJECTS = [
  {
    padLabel: "PAD ALPHA",
    name: "Project Alpha",
    image: "",  // e.g. "images/alpha.png"
    description: "A fast-paced 2D platformer with procedurally generated levels and hand-crafted pixel art. Built solo in Unity over six months as a personal passion project exploring generative design.",
    tags: ["Unity", "C#", "Procedural Gen", "2D Platformer"],
    links: [
      { label: "PLAY DEMO", href: "#" },
      { label: "SOURCE CODE", href: "#" }
    ]
  },
  {
    padLabel: "PAD BETA",
    name: "Project Beta",
    image: "",
    description: "A top-down survival roguelite with real-time combat, crafting, and a dynamic day/night cycle. Shipped in 72 hours for a university game jam — placed 2nd overall.",
    tags: ["Godot 4", "GDScript", "Roguelite", "Game Jam"],
    links: [
      { label: "PLAY ON ITCH.IO", href: "#" },
      { label: "JAM PAGE", href: "#" }
    ]
  },
  {
    padLabel: "PAD GAMMA",
    name: "Project Gamma",
    image: "",
    description: "An atmospheric puzzle game built around light and shadow mechanics. Players manipulate geometry to project silhouettes and solve environmental puzzles across surreal dreamscapes.",
    tags: ["Unreal 5", "C++", "Blueprints", "Puzzle"],
    links: [
      { label: "TRAILER", href: "#" },
      { label: "CASE STUDY", href: "#" }
    ]
  },
  {
    padLabel: "PAD DELTA",
    name: "Project Delta",
    image: "",
    description: "A multiplayer arena shooter prototype with custom client-side prediction netcode. Focused on achieving sub-50ms effective latency at moderate tick rates using a rollback-inspired approach.",
    tags: ["Unity", "C#", "Networking", "Multiplayer", "Prototype"],
    links: [
      { label: "DEVLOG", href: "#" },
      { label: "GITHUB", href: "#" }
    ]
  }
];
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

let W, H;
const resize = () => {
  W = canvas.width  = canvas.offsetWidth;
  H = canvas.height = canvas.offsetHeight;
  if (gameStarted) { generateTerrain(); generateStars(); }
};
window.addEventListener('resize', resize);
resize();

// Physics
const GRAVITY    = 0.038;
const THRUST     = 0.11;
const ROT_SPD    = 2.6;   // deg/frame
const SAFE_SPD   = 1.7;   // m/s max on landing
const SAFE_ANG   = 17;    // degrees from vertical
const PAD_W      = 82;
const WORLD_MULT = 3;     // world is 3× canvas width

let gameStarted = false, gameOver = false, hasLanded = false;
let stars = [], terrain = [], pads = [], particles = [];
let lander, camX = 0, targetCamX = 0;

// Input
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// Touch
let tLeft = false, tRight = false, tThrust = false;
const addTouch = (id, setter) => {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', () => setter(true));
  el.addEventListener('pointerup',   () => setter(false));
  el.addEventListener('pointerleave',() => setter(false));
};
addTouch('tl', v => tLeft   = v);
addTouch('tr', v => tRight  = v);
addTouch('tt', v => tThrust = v);

// ── Stars ──────────────────────────────────────────────────────
function generateStars() {
  stars = [];
  for (let i = 0; i < 320; i++) {
    stars.push({
      x:    Math.random() * W * WORLD_MULT,
      y:    Math.random() * H * 0.82,
      r:    Math.random() * 1.7 + 0.25,
      b:    Math.random(),
      layer: Math.floor(Math.random() * 3)
    });
  }
}

// ── Terrain ────────────────────────────────────────────────────
function generateTerrain() {
  terrain = [];
  const WW  = W * WORLD_MULT;
  const SEG = 90;
  const sw  = WW / SEG;
  let heights = [];
  let h = H * 0.55;
  for (let i = 0; i <= SEG; i++) {
    h += (Math.random() - 0.5) * 38;
    h  = Math.max(H * 0.28, Math.min(H * 0.73, h));
    heights.push(h);
  }
  // Pad placement
  pads = [];
  const positions = [0.10, 0.33, 0.60, 0.84];
  positions.forEach((pos, i) => {
    const si  = Math.floor(pos * SEG);
    const py  = heights[si];
    for (let j = -3; j <= 3; j++) {
      const idx = si + j;
      if (idx >= 0 && idx <= SEG) heights[idx] = py;
    }
    pads.push({
      x: si * sw - PAD_W / 2, y: py, w: PAD_W,
      projectIndex: i, unlocked: false, phase: Math.random() * Math.PI * 2
    });
  });
  for (let i = 0; i <= SEG; i++) terrain.push({ x: i * sw, y: heights[i] });
}

// ── Lander init ────────────────────────────────────────────────
function initLander() {
  lander = {
    x: W * 1.5, y: 80,
    vx: 0, vy: 0,
    angle: 0, fuel: 100,
    alive: true, thrusting: false, ptTimer: 0
  };
  gameOver  = false;
  hasLanded = false;
  camX      = lander.x - W / 2;
  targetCamX = camX;
  particles = [];
  document.getElementById('overlay').classList.remove('show');
}

// ── Helpers ────────────────────────────────────────────────────
function terrainYAt(wx) {
  const WW  = W * WORLD_MULT;
  const sw  = WW / 90;
  const idx = Math.floor(wx / sw);
  if (idx < 0 || idx >= terrain.length - 1) return H;
  const t = (wx - terrain[idx].x) / sw;
  return terrain[idx].y * (1 - t) + terrain[idx + 1].y * t;
}

function padAt(wx, wy) {
  for (const p of pads)
    if (wx >= p.x && wx <= p.x + p.w && Math.abs(wy - p.y) < 7) return p;
  return null;
}

function spawnBurst(x, y, n, colorFn, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * spd;
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - Math.random()*2,
      life: 1, decay: 0.02 + Math.random()*0.03,
      sz: Math.random()*4+1, col: colorFn()
    });
  }
}

function spawnThrust() {
  const ex = lander.x - Math.sin(lander.angle) * 18;
  const ey = lander.y + Math.cos(lander.angle) * 18;
  const ba  = lander.angle + Math.PI;
  const sp  = Math.random() * 2.5 + 1;
  const ang = ba + (Math.random() - 0.5) * 0.5;
  particles.push({
    x: ex, y: ey,
    vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
    life: 1, decay: 0.07 + Math.random()*0.07,
    sz: Math.random()*5+2,
    col: `hsl(${25 + Math.random()*35},100%,${50 + Math.random()*30}%)`
  });
}

// ── Custom rounded rect ────────────────────────────────────────
function roundRect(cx, x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x + r, y);
  cx.lineTo(x + w - r, y);
  cx.quadraticCurveTo(x + w, y, x + w, y + r);
  cx.lineTo(x + w, y + h - r);
  cx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  cx.lineTo(x + r, y + h);
  cx.quadraticCurveTo(x, y + h, x, y + h - r);
  cx.lineTo(x, y + r);
  cx.quadraticCurveTo(x, y, x + r, y);
  cx.closePath();
}

// ── Update ─────────────────────────────────────────────────────
function update(dt) {
  if (!lander.alive || hasLanded || gameOver) return;

  const doThrust = (keys['ArrowUp'] || keys['w'] || keys['W'] || tThrust) && lander.fuel > 0;
  const doLeft   =  keys['ArrowLeft']  || keys['a'] || keys['A'] || tLeft;
  const doRight  =  keys['ArrowRight'] || keys['d'] || keys['D'] || tRight;

  if (doLeft)  lander.angle -= (ROT_SPD * Math.PI / 180) * dt;
  if (doRight) lander.angle += (ROT_SPD * Math.PI / 180) * dt;

  if (doThrust) {
    lander.vx  += -Math.sin(lander.angle) * THRUST * dt;
    lander.vy  += -Math.cos(lander.angle) * THRUST * dt;
    lander.fuel = Math.max(0, lander.fuel - 0.14 * dt);
    lander.thrusting = true;
    lander.ptTimer  -= dt;
    if (lander.ptTimer <= 0) { spawnThrust(); lander.ptTimer = 0.4; }
  } else {
    lander.thrusting = false;
  }

  lander.vy += GRAVITY * dt;
  lander.x  += lander.vx * dt;
  lander.y  += lander.vy * dt;

  // Camera
  targetCamX = lander.x - W / 2;
  targetCamX = Math.max(0, Math.min(targetCamX, W * (WORLD_MULT - 1)));
  camX += (targetCamX - camX) * 0.09 * dt;

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 0.05 * dt; p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Collision
  const bottom = lander.y + 14;
  const ty     = terrainYAt(lander.x);
  if (bottom >= ty) {
    const spd = Math.sqrt(lander.vx*lander.vx + lander.vy*lander.vy);
    let   ang = (lander.angle * 180 / Math.PI) % 360;
    if (ang < 0) ang += 360;
    const normAng = ang > 180 ? 360 - ang : ang;
    const pad = padAt(lander.x, ty);

    if (pad && spd < SAFE_SPD && normAng < SAFE_ANG) {
      lander.y = ty - 14; lander.vx = 0; lander.vy = 0; lander.angle = 0;
      hasLanded = true; pad.unlocked = true;
      spawnBurst(lander.x, lander.y, 22,
        () => `rgba(57,255,20,${(Math.random()*.6+.3).toFixed(2)})`, 1.8);
      setTimeout(() => showModal(pad.projectIndex, pad.padLabel), 700);
    } else {
      lander.alive = false;
      spawnBurst(lander.x, lander.y, 55,
        () => `rgba(${220+Math.random()*35|0},${80+Math.random()*80|0},10,${(Math.random()*.7+.3).toFixed(2)})`, 4.5);
      spawnBurst(lander.x, lander.y, 25,
        () => `rgba(255,230,80,${(Math.random()*.5+.5).toFixed(2)})`, 2.5);
      setTimeout(() => {
        if (!pad)       showOverlay('crash', 'Land on an orange pad.');
        else if (spd >= SAFE_SPD) showOverlay('crash', `Speed ${spd.toFixed(1)} m/s — max ${SAFE_SPD} m/s`);
        else            showOverlay('crash', `Angle ${normAng.toFixed(0)}° — max ${SAFE_ANG}°`);
      }, 480);
    }
  }
  if (lander.x < 0 || lander.x > W * WORLD_MULT || lander.y < -300) {
    lander.alive = false;
    setTimeout(() => showOverlay('crash', 'Out of bounds.'), 300);
  }

  // HUD
  const spd = Math.sqrt(lander.vx*lander.vx + lander.vy*lander.vy);
  const velEl = document.getElementById('h-vel');
  velEl.textContent = spd.toFixed(1) + ' m/s';
  velEl.className = 'hud-value' + (spd > SAFE_SPD * 2.2 ? ' danger' : spd > SAFE_SPD ? ' warn' : '');
  document.getElementById('h-fuel').textContent = Math.ceil(lander.fuel) + '%';
  const bar = document.getElementById('fuel-bar');
  bar.style.width    = lander.fuel + '%';
  bar.style.background = lander.fuel < 20 ? '#ff2020' : lander.fuel < 45 ? '#ff8c00' : '#39ff14';
  document.getElementById('h-alt').textContent = Math.max(0, Math.floor(ty - bottom)) + ' m';
}

// ── Draw ───────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Sky
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#000008');
  bg.addColorStop(1, '#020b12');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Stars (parallax)
  const t = Date.now() * 0.001;
  for (const s of stars) {
    const px = [0.08, 0.28, 0.55][s.layer];
    const sx = ((s.x - camX * px) % (W * WORLD_MULT) + W * WORLD_MULT) % (W * WORLD_MULT);
    const tw = 0.7 + 0.3 * Math.sin(t * s.b + s.x);
    ctx.globalAlpha = (0.3 + 0.7 * s.b) * tw;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sx, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Earth
  const ex = W * 0.78 - camX * 0.04, ey = H * 0.14;
  const eg = ctx.createRadialGradient(ex-8, ey-8, 4, ex, ey, 58);
  eg.addColorStop(0,   'rgba(28,75,170,.9)');
  eg.addColorStop(0.4, 'rgba(20,130,55,.55)');
  eg.addColorStop(1,   'rgba(8,16,55,.3)');
  ctx.beginPath(); ctx.arc(ex, ey, 58, 0, Math.PI*2);
  ctx.fillStyle = eg; ctx.fill();
  ctx.strokeStyle = 'rgba(90,150,255,.28)'; ctx.lineWidth = 1; ctx.stroke();
  const atm = ctx.createRadialGradient(ex, ey, 52, ex, ey, 74);
  atm.addColorStop(0, 'rgba(50,110,255,.18)');
  atm.addColorStop(1, 'rgba(50,110,255,0)');
  ctx.beginPath(); ctx.arc(ex, ey, 74, 0, Math.PI*2);
  ctx.fillStyle = atm; ctx.fill();

  ctx.save();
  ctx.translate(-camX, 0);

  // Terrain fill
  if (terrain.length) {
    ctx.beginPath();
    ctx.moveTo(terrain[0].x, terrain[0].y);
    for (const p of terrain) ctx.lineTo(p.x, p.y);
    ctx.lineTo(terrain[terrain.length-1].x, H+50);
    ctx.lineTo(terrain[0].x, H+50);
    ctx.closePath();
    const tg = ctx.createLinearGradient(0, H*0.35, 0, H+50);
    tg.addColorStop(0,   '#0c1f0a');
    tg.addColorStop(0.4, '#060e05');
    tg.addColorStop(1,   '#020502');
    ctx.fillStyle = tg; ctx.fill();

    // Surface line glow
    ctx.shadowBlur   = 6;
    ctx.shadowColor  = 'rgba(57,255,20,.22)';
    ctx.beginPath();
    ctx.moveTo(terrain[0].x, terrain[0].y);
    for (const p of terrain) ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = 'rgba(57,255,20,.65)';
    ctx.lineWidth   = 1.5; ctx.stroke();
    ctx.shadowBlur  = 0;
  }

  // Landing pads
  const pt = Date.now() * 0.0022;
  for (let i = 0; i < pads.length; i++) {
    const pad  = pads[i];
    const proj = PROJECTS[pad.projectIndex];
    const glow = 0.5 + 0.5 * Math.sin(pt + pad.phase);
    const col  = pad.unlocked ? [57,255,20] : [255,165,0];

    ctx.shadowBlur  = 8 + glow * 12;
    ctx.shadowColor = `rgba(${col},0.7)`;

    // Pad slab
    ctx.fillStyle   = `rgba(${col},${0.13 + glow*0.09})`;
    ctx.fillRect(pad.x, pad.y - 4, pad.w, 4);
    ctx.strokeStyle = `rgb(${col})`; ctx.lineWidth = 2;
    ctx.strokeRect(pad.x, pad.y - 4, pad.w, 4);

    // Vertical markers
    ctx.fillStyle = `rgb(${col})`;
    [[pad.x, pad.y],[pad.x+pad.w, pad.y]].forEach(([mx,my]) => {
      ctx.fillRect(mx-2, my-14, 4, 14);
    });

    // Blinking lights
    if (Math.sin(pt * 3 + i) > 0) {
      [[pad.x+7,pad.y-8],[pad.x+pad.w-7,pad.y-8]].forEach(([lx,ly]) => {
        ctx.beginPath(); ctx.arc(lx, ly, 3.5, 0, Math.PI*2);
        ctx.fill();
      });
    }

    ctx.shadowBlur = 0;

    // Label
    ctx.font        = '13px VT323, monospace';
    ctx.textAlign   = 'center';
    ctx.fillStyle   = `rgba(${col},0.88)`;
    ctx.fillText(proj ? proj.name : pad.padLabel, pad.x + pad.w/2, pad.y - 19);
    if (pad.unlocked) {
      ctx.font      = '11px VT323, monospace';
      ctx.fillStyle = `rgba(${col},0.5)`;
      ctx.fillText('✓ VISITED', pad.x + pad.w/2, pad.y - 8);
    }
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle   = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.1, p.sz * p.life), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Lander
  if (lander && (lander.alive || !gameOver || hasLanded)) {
    ctx.save();
    ctx.translate(lander.x, lander.y);
    ctx.rotate(lander.angle);

    // Thrust flame
    if (lander.thrusting && lander.alive) {
      const fh = 14 + Math.random()*12;
      const fg = ctx.createLinearGradient(0, 14, 0, 14 + fh);
      fg.addColorStop(0,   'rgba(255,255,200,.9)');
      fg.addColorStop(0.4, 'rgba(255,140,20,.7)');
      fg.addColorStop(1,   'rgba(255,50,0,0)');
      ctx.beginPath();
      ctx.moveTo(-7, 14); ctx.lineTo(0, 14+fh); ctx.lineTo(7, 14);
      ctx.fillStyle = fg; ctx.fill();
    }

    ctx.shadowBlur  = 10;
    ctx.shadowColor = 'rgba(57,255,20,.45)';
    ctx.strokeStyle = '#39ff14';
    ctx.fillStyle   = 'rgba(8,24,8,.92)';
    ctx.lineWidth   = 1.5;

    // Body
    roundRect(ctx, -10, -14, 20, 20, 3);
    ctx.fill(); ctx.stroke();

    // Dome
    ctx.beginPath();
    ctx.arc(0, -14, 10, Math.PI, 0);
    ctx.fill(); ctx.stroke();

    // Window
    ctx.beginPath();
    ctx.arc(0, -11, 5, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(90,200,255,.55)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(57,255,20,.7)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Legs
    ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 1.5;
    [[-1],[1]].forEach(([sx]) => {
      ctx.beginPath();
      ctx.moveTo(sx*9, 4); ctx.lineTo(sx*18, 14);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(sx*14, 14); ctx.lineTo(sx*22, 14);
      ctx.stroke();
    });

    ctx.shadowBlur = 0;
    ctx.restore();
  }

  ctx.restore(); // end camX translate

  drawMinimap();
}

// ── Mini-map ───────────────────────────────────────────────────
function drawMinimap() {
  const mw=190, mh=52, mx=W-mw-14, my=H-mh-14;
  const WW = W * WORLD_MULT;

  ctx.fillStyle   = 'rgba(0,8,0,.75)';
  ctx.strokeStyle = 'rgba(57,255,20,.32)';
  ctx.lineWidth   = 1;
  ctx.fillRect(mx, my, mw, mh);
  ctx.strokeRect(mx, my, mw, mh);

  ctx.font      = '10px VT323, monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(57,255,20,.38)';
  ctx.fillText('SURFACE MAP', mx+5, my+11);

  // Terrain line
  ctx.beginPath();
  terrain.forEach((pt, i) => {
    const px = mx + (pt.x / WW) * mw;
    const py = my + mh * 0.85 - ((H - pt.y) / H) * mh * 1.1;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  });
  ctx.strokeStyle = 'rgba(57,255,20,.45)'; ctx.lineWidth = 1; ctx.stroke();

  // Pads
  for (const p of pads) {
    const px = mx + ((p.x + p.w/2) / WW) * mw;
    const py = my + mh * 0.85 - ((H - p.y) / H) * mh * 1.1;
    ctx.fillStyle = p.unlocked ? '#39ff14' : '#ffa500';
    ctx.beginPath(); ctx.arc(px, py, 3.5, 0, Math.PI*2); ctx.fill();
  }

  // Lander dot
  if (lander) {
    const lx = mx + (lander.x / WW) * mw;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(lx, my + mh*0.38, 3, 0, Math.PI*2); ctx.fill();
  }

  // Viewport rect
  const vx = mx + (camX / WW) * mw;
  const vw = (W / WW) * mw;
  ctx.strokeStyle = 'rgba(255,255,255,.18)';
  ctx.strokeRect(vx, my+1, vw, mh-2);
}

// ── Game loop ──────────────────────────────────────────────────
let last = 0;
function loop(ts) {
  const dt = Math.min((ts - last) / 16.67, 3);
  last = ts;
  update(dt);
  draw();
  if (gameStarted) requestAnimationFrame(loop);
}

// ── UI helpers ─────────────────────────────────────────────────
function showOverlay(type, sub) {
  const el  = document.getElementById('overlay');
  const ttl = document.getElementById('overlay-title');
  const sb  = document.getElementById('overlay-sub');
  ttl.textContent = type === 'crash' ? 'CRASH' : 'LANDED';
  ttl.className   = type === 'crash' ? 'crash'  : 'success';
  sb.textContent  = sub;
  el.classList.add('show');
  gameOver = true;
}

function showModal(idx, padLabel) {
  const p = PROJECTS[idx]; if (!p) return;
  document.getElementById('m-pad').textContent   = padLabel;
  document.getElementById('m-title').textContent = p.name;
  document.getElementById('m-desc').textContent  = p.description;

  const imgDiv = document.getElementById('m-img');
  imgDiv.innerHTML = p.image
    ? `<img src="${p.image}" alt="${p.name}">`
    : `<span class="ph">[ SET image: "${p.name.toLowerCase().replace(/\s/g,'')}.png" ]</span>`;

  document.getElementById('m-tags').innerHTML  = p.tags.map(t=>`<span class="m-tag">${t}</span>`).join('');
  document.getElementById('m-links').innerHTML = p.links.map(l=>`<a class="m-link" href="${l.href}">${l.label}</a>`).join('');

  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  if (hasLanded) showOverlay('success', 'Ready for the next pad?');
}

function startGame() {
  const ts = document.getElementById('title-screen');
  ts.style.opacity = '0';
  setTimeout(() => {
    ts.style.display = 'none';
    gameStarted = true;
    generateStars(); generateTerrain(); initLander();
    requestAnimationFrame(loop);
  }, 600);
}

function resetGame() {
  initLander();
}

// Bind buttons
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', resetGame);
document.getElementById('modalClose').addEventListener('click', closeModal);
</script>
